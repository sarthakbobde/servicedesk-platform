{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:40px auto">
<h1>Sign in</h1>
{% if expired %}<p class="flash err" role="alert">Your session expired. Sign in again.</p>{% endif %}
{% if error %}<p class="flash err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p><button class="primary" type="submit">Sign in</button></p>
</form>
</div>
{% endblock %}
