{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1>Hello, {{ me.name }}</h1>
<div class="grid">
{% for label, n, href in tiles %}
  <a class="tile" href="{{ href }}"><span class="n">{{ n if n is not none else 0 }}</span><span class="l">{{ label }}</span></a>
{% endfor %}
</div>
<p style="margin-top:16px"><a class="btn" href="/tickets/new">Raise a ticket</a></p>
{% endblock %}
